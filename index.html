<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 15px 15px; text-align: center; }
.header h1 { font-size: 20px; margin-bottom: 5px; }

.stats-bar { display: flex; justify-content: space-around; background: white; padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 12px; }
.stats-bar div { text-align: center; }
.stats-bar span { display: block; font-size: 18px; font-weight: bold; color: #667eea; }
.tab-bar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #ddd; z-index: 100; }
.tab-bar button { flex: 1; padding: 12px 4px; border: none; background: none; font-size: 11px; color: #666; }
.tab-bar button.active { color: #667eea; font-weight: bold; }
.tab-bar button span { display: block; font-size: 18px; margin-bottom: 2px; }
.cat-bar { display: flex; overflow-x: auto; padding: 10px; gap: 8px; background: white; border-bottom: 1px solid #eee; }
.cat-bar button { white-space: nowrap; padding: 6px 14px; border: 1px solid #ddd; border-radius: 20px; background: white; font-size: 13px; }
.cat-bar button.active { background: #667eea; color: white; border-color: #667eea; }
.card { background: white; margin: 15px; border-radius: 12px; padding: 20px; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.card .cn { font-size: 18px; color: #333; margin-bottom: 15px; }
.card .en { font-size: 16px; color: #667eea; }
.card .level { font-size: 12px; color: #999; margin-top: 10px; }
.btn-row { display: flex; gap: 10px; padding: 0 15px; margin-top: 10px; }
.btn-row button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; }
.btn-know { background: #4caf50; color: white; }
.btn-forget { background: #ff9800; color: white; }
.review-banner { background: #fff3e0; padding: 10px 15px; text-align: center; font-size: 14px; color: #e65100; }
.list-item { background: white; margin: 8px 15px; padding: 12px; border-radius: 8px; font-size: 13px; }
.list-item .cn { color: #333; }
.list-item .en { color: #667eea; font-size: 12px; margin-top: 4px; }
.list-item .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-top: 5px; }
.tag-due { background: #fff3e0; color: #e65100; }
.tag-mastered { background: #e8f5e9; color: #2e7d32; }
.add-form { padding: 15px; }
.add-form input, .add-form textarea, .add-form select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.add-form button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
.dictation-area { padding: 15px; }
.dictation-area .cn-prompt { background: white; padding: 20px; border-radius: 12px; font-size: 18px; text-align: center; margin-bottom: 15px; }
.dictation-result { padding: 15px; }
.dictation-result .word-correct { color: #4caf50; }
.dictation-result .word-wrong { color: #f44336; }
</style>
</head>

<div class="cat-bar" id="catBar"></div>

<div id="mainArea"></div>
