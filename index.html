<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>英语口语记忆工具</title>
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background: #f5f5f5; }
  .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .cn { color: #666; margin-bottom: 8px; font-size: 16px; }
  .en { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; }
  button { padding: 10px 16px; border: none; border-radius: 8px; background: #667eea; color: white; cursor: pointer; margin-right: 8px; margin-bottom: 8px; font-size: 14px; }
  button:hover { opacity: 0.9; }
  .dictation-area { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #eee; }
  textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; font-size: 16px; }
  .word-correct { color: #28a745; font-weight: bold; }
  .word-wrong { color: #dc3545; text-decoration: line-through; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab-btn { background: #ddd; color: #333; }
  .tab-btn.active { background: #667eea; color: white; }
</style>
</head>
<body>

<h1>🎯 英语口语记忆工具</h1>
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('study')">学习</button>
  <button class="tab-btn" onclick="switchTab('dictate')">听写</button>
  <button class="tab-btn" onclick="switchTab('add')">添加</button>
</div>

<div id="mainArea"></div>

<script>
let data = { sentences: [], mode: 'study' };
const categories = ['全部', '日常', '商务', '旅行'];

// 初始化默认数据
if (!data.sentences || data.sentences.length === 0) {
  data.sentences = [
    { id: 1, cn: '你好吗？', en: 'How are you doing?', cat: '日常', level: 0, nextReview: 0, mastered: false, dictPass: false },
    { id: 2, cn: '我很高兴认识你。', en: 'Nice to meet you.', cat: '日常', level: 0, nextReview: 0, mastered: false, dictPass: false }
  ];
}

// ============ 语音朗读优化 ============
function speak(text) {
  if (!window.speechSynthesis) {
    alert('你的浏览器不支持语音朗读，请换用 Chrome 或 Edge 浏览器。');
    return;
  }
  window.speechSynthesis.cancel(); // 停止当前朗读
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US'; // 强制指定美式英语
  utterance.rate = 1.0;    // 正常语速 (0.1-10，1为正常)
  utterance.pitch = 1.0;   // 正常音调
  utterance.volume = 1.0;  // 最大音量
  
  // 尝试获取系统里更自然的英语语音包
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Google')) || 
                  voices.find(v => v.lang.includes('en-US'));
  if (enVoice) {
    utterance.voice = enVoice;
  }
  
  window.speechSynthesis.speak(utterance);
}

// 部分浏览器需要加载语音列表
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    console.log("语音包加载完成");
  };
}

// ============ 界面切换与渲染 ============
function switchTab(tab) {
  data.mode = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderCurrentTab();
}

function renderCurrentTab() {
  const area = document.getElementById('mainArea');
  if (data.mode === 'study') renderStudy(area);
  else if (data.mode === 'dictate') renderDictate(area);
  else if (data.mode === 'add') renderAdd(area);
}

function renderStudy(area) {
  const list = data.sentences;
  if (list.length === 0) { area.innerHTML = '<p>暂无句子，去添加吧！</p>'; return; }
  
  area.innerHTML = list.map(s => `
    <div class="card">
      <div class="cn">${s.cn}</div>
      <div class="en">${s.en}</div>
      <button onclick="speak('${s.en.replace(/'/g, "\\'")}')">🔊 朗读</button>
      <button onclick="alert('已标记为掌握！')">✅ 标记掌握</button>
      
      <div class="dictation-area">
        <button onclick="showDictInput(${s.id})">✍️ 听写这句</button>
      </div>
      <div id="dict-container-${s.id}"></div>
    </div>
  `).join('');
}

function showDictInput(id) {
  const container = document.getElementById(`dict-container-${id}`);
  const s = data.sentences.find(x => x.id === id);
  
  // 点击听写时自动朗读一遍
  speak(s.en);
  
  container.innerHTML = `
    <textarea id="dictInput" rows="2" placeholder="请听写英文..."></textarea>
    <div id="dictHint" style="font-size:12px;color:#888;margin-bottom:8px;"></div>
    <button onclick="checkDict('${s.en.replace(/'/g, "\\'")}', ${id})">批改</button>
  `;
  
  // 实时监听输入匹配度
  document.getElementById('dictInput').addEventListener('input', () => checkDictRealTime(s.en));
}

function checkDictRealTime(answer) {
  const input = document.getElementById('dictInput').value.toLowerCase().trim();
  const hint = document.getElementById('dictHint');
  if (!input) { hint.textContent = ''; return; }
  const words = answer.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/);
  const inputWords = input.replace(/[^\w\s]/g,'').split(/\s+/);
  let matched = 0;
  words.forEach(w => { if (inputWords.some(iw => iw.includes(w.substring(0,3)))) matched++; });
  hint.textContent = `已匹配 ${matched}/${words.length} 个词块`;
}

function checkDict(answer, id) {
  const input = document.getElementById('dictInput').value;
  const area = document.getElementById('mainArea');
  const s = data.sentences.find(x => x.id === id);
  const userWords = input.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/);
  const ansWords = answer.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/);
  let correct = 0;
  let result = '';
  ansWords.forEach(w => {
    const isCorrect = userWords.some(uw => uw === w || uw.includes(w.substring(0, Math.min(3, w.length))));
    if (isCorrect) { correct++; result += `<span class="word-correct">${w}</span> `; }
    else result += `<span class="word-wrong">${w}</span> `;
  });
  const score = Math.round(correct / ansWords.length * 100);
  if (score >= 70 && s) { s.dictPass = true; saveData(); }
  area.innerHTML = `
    <div class="dictation-result">
      <p style="margin-bottom:10px;">得分：<strong>${score}%</strong></p>
      <p>${result}</p>
      <p style="margin-top:10px;font-size:13px;color:#666;">正确答案：${answer}</p>
      <button onclick="renderStudy(document.getElementById('mainArea'))" style="
