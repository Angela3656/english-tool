// ============ 数据管理 ============
let data = { sentences: [], studyRecords: {}, lastDate: "", streak: 0 };

function loadData() {
  try {
    const saved = localStorage.getItem('waimao_sentences');
    const records = localStorage.getItem('waimao_records');
    const meta = localStorage.getItem('waimao_meta');
    if (saved) data.sentences = JSON.parse(saved);
    if (records) data.studyRecords = JSON.parse(records);
    if (meta) { const m = JSON.parse(meta); data.lastDate = m.lastDate || ""; data.streak = m.streak || 0; }
    const existingCns = data.sentences.map(s => s.cn);
    let added = 0;
    builtinSentences.forEach(bs => {
      if (!existingCns.includes(bs.cn)) {
        data.sentences.push({ ...bs, id: Date.now() + Math.random(), level: 0, nextReview: 0, mastered: false, dictPass: false });
        added++;
      }
    });
    if (added > 0) saveData();
  } catch(e) {
    data.sentences = builtinSentences.map((bs,i) => ({ ...bs, id: i, level: 0, nextReview: 0, mastered: false, dictPass: false }));
  }
  updateStats();
}

function saveData() {
  try {
    localStorage.setItem('waimao_sentences', JSON.stringify(data.sentences));
    localStorage.setItem('waimao_records', JSON.stringify(data.studyRecords));
    localStorage.setItem('waimao_meta', JSON.stringify({ lastDate: data.lastDate, streak: data.streak }));
  } catch(e) { console.log('save failed'); }
}

function updateStats() {
  document.getElementById('statTotal').textContent = data.sentences.length;
  const due = data.sentences.filter(s => s.nextReview <= Date.now() && !s.mastered).length;
  document.getElementById('statDue').textContent = due;
  const mastered = data.sentences.filter(s => s.mastered).length;
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('statStreak').textContent = data.streak;
  if (due > 0) {
    document.getElementById('reviewBanner').style.display = 'block';
    document.getElementById('bannerCount').textContent = due;
  } else {
    document.getElementById('reviewBanner').style.display = 'none';
  }
}

// ============ 艾宾浩斯 ============
const intervals = [0, 3600000, 86400000, 172800000, 345600000, 604800000, 1296000000];

function markKnown(id) {
  const s = data.sentences.find(x => x.id === id);
  if (!s) return;
  s.level = Math.min(s.level + 1, 7);
  if (s.level >= 7) { s.mastered = true; s.nextReview = 0; } else { s.nextReview = Date.now() + intervals[s.level]; }
  const today = new Date().toDateString();
  if (data.lastDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (data.lastDate === yesterday) data.streak++; else data.streak = 1;
    data.lastDate = today;
  }
  saveData(); updateStats(); renderCurrentTab();
}

function markForget(id) {
  const s = data.sentences.find(x => x.id === id);
  if (!s) return;
  s.level = 0; s.nextReview = Date.now() + intervals[0]; s.mastered = false;
  saveData(); updateStats(); renderCurrentTab();
}

// ============ 发音（修复：正常语速+强制英语语音） ============
function speakText(text) {
  if (!('speechSynthesis' in window)) { alert('浏览器不支持语音'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 1.0;
  u.pitch = 1.0;
  u.volume = 1.0;
  const voices = speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang && v.lang.startsWith('en'));
  if (enVoice) u.voice = enVoice;
  speechSynthesis.speak(u);
}

// ============ 听写功能 ============
function startDictation(id) {
  const s = data.sentences.find(x => x.id === id);
  if (!s) return;
  speakText(s.en);
  setTimeout(function(){ speakText(s.en); }, 2000);
  const area = document.getElementById('mainArea');
  area.innerHTML = '<div style="background:white;margin:15px;border-radius:12px;padding:20px;">' +
    '<p style="text-align:center;margin-bottom:15px;font-size:16px;">🔊 已播放两遍，请听写：</p>' +
    '<textarea id="dictInput" placeholder="凭听力在这里写下英文..." style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;min-height:100px;"></textarea>' +
    '<button onclick="checkDictationResult(' + s.id + ')" style="margin-top:15px;width:100%;padding:14px;background:#667eea;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;">📝 批改</button>' +
    '<button onclick="renderCurrentTab()" style="margin-top:10px;width:100%;padding:12px;background:#eee;border:none;border-radius:8px;font-size:14px;">← 返回学习</button>' +
    '</div>';
}

function checkDictationResult(id) {
  const s = data.sentences.find(x => x.id === id);
  const input = document.getElementById('dictInput').value.trim();
  if (!input) { alert('请先输入你听到的内容'); return; }
  const userWords = input.toLowerCase().replace(/[^\\w\\s]/g,'').split(/\\s+/);
  const ansWords = s.en.toLowerCase().replace(/[^\\w\\s]/g,'').split(/\\s+/);
  let correct = 0;
  ansWords.forEach(function(w) {
    if (userWords.some(function(uw) { return uw === w || uw.indexOf(w.substring(0, Math.min(3, w.length))) >= 0; })) correct++;
  });
  const score = Math.round(correct / ansWords.length * 100);
  const area = document.getElementById('mainArea');
  area.innerHTML = '<div style="background:white;margin:15px;border-radius:12px;padding:20px;">' +
    '<p style="margin-bottom:10px;font-size:18px;">得分：<strong style="color:' + (score>=70?'#4caf50':'#f44336') + ';">' + score + '%</strong></p>' +
    '<p style="margin-bottom:8px;">你的输入：<br><span style="color:#666;">' + input + '</span></p>' +
    '<p style="margin-bottom:8px;">正确答案：<br><span style="color:#667eea;">' + s.en + '</span></p>' +
    (score >= 70 ? '<p style="color:#4caf50;font-weight:bold;">✅ 听写通过！</p>' : '<p style="color:#f44336;">❌ 还需努力</p>') +
    '<button onclick="' + (score>=70 ? 'markKnown(' + s.id + ')' : 'markForget(' + s.id + ')') + '" style="margin-top:15px;width:100%;padding:14px;background:' + (score>=70?'#4caf50':'#ff9800') + ';color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;">' + (score>=70?'✅ 标记为已掌握':'❌ 标记为未掌握') + '</button>' +
    '<button onclick="renderCurrentTab()" style="margin-top:10px;width:100%;padding:12px;background:#eee;border:none;border-radius:8px;font-size:14px;">← 返回学习</button>' +
    '</div>';
}

// ============ 标签切换（修复：传入this参数） ============
let currentTab = 'study';
let currentCat = '全部';

function switchTab(tab, btn) {
  currentTab = tab;
  const buttons = document.querySelectorAll('.tab-bar button');
  for (let i = 0; i < buttons.length; i++) {
    buttons[i].classList.remove('active');
  }
  if (btn) btn.classList.add('active');
  renderCurrentTab();
}

function renderCurrentTab() {
  const area = document.getElementById('mainArea');
  if (currentTab === 'study') renderStudy(area);
  else if (currentTab === 'review') renderReview(area);
  else if (currentTab === 'dictate') renderDictate(area);
  else if (currentTab === 'add') renderAdd(area);
  else if (currentTab === 'list') renderList(area);
}

// ============ 分类栏 ============
function renderCatBar() {
  const bar = document.getElementById('catBar');
  let html = '';
  for (let i = 0; i < categories.length; i++) {
    html += '<button class="' + (categories[i]===currentCat?'active':'') + '" onclick="setCat(\'' + categories[i] + '\')">' + categories[i] + '</button>';
  }
  bar.innerHTML = html;
}

function setCat(c) { currentCat = c; renderCatBar(); renderCurrentTab(); }

function getFiltered() {
  if (currentCat === '全部') return data.sentences;
  return data.sentences.filter(function(s) { return s.cat === currentCat; });

  const list = getFiltered().filter(function(s) { return !s.mastered && s.nextReview <= Date.now(); });

  area.innerHTML = '<div class="card" onclick="flipCard()">' +
    '<div class="cn">' + s.cn + '</div>' +
    '<div class="en" id="enText" style="display:none;">' + s.en + '</div>' +
    '<div class="level">L' + s.level + ' ' + (s.mastered?'✅已固化':'') + '</div>' +
    '</div>' +
    '<div class="btn-row">' +
    '<button class="btn-know" onclick="markKnown(' + s.id + ')">✅ 记住了</button>' +
    '<button class="btn-forget" onclick="markForget(' + s.id + ')">❌ 还没记住</button>' +
    '</div>' +
